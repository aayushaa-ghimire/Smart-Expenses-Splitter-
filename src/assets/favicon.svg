<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="128" fill="#8b263e" />
  
  <!-- Outer Soft Pink Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#fce4ec" stroke-width="12" stroke-opacity="0.25" />
  
  <!-- Division / Split Symbol Element -->
  <g fill="#ffffff">
    <!-- Top Dot -->
    <circle cx="256" cy="150" r="32" />
    
    <!-- Central Split Bar -->
    <rect x="140" y="236" width="232" height="40" rx="20" />
    
    <!-- Bottom Dot -->
    <circle cx="256" cy="362" r="32" />
  </g>
</svg>
